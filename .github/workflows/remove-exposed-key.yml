name: Remove exposed Gemini key

on:
  push:
    paths:
      - '.github/workflows/remove-exposed-key.yml'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove hardcoded Gemini key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app-v22.html')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r"const FIXED_GEMINI_API_KEY\s*=\s*'[^']*';",
              "const FIXED_GEMINI_API_KEY = 'SERVER_SIDE_ONLY';",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected hardcoded API key declaration was not found exactly once.')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit sanitized file
        run: |
          if git diff --quiet -- app-v22.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v22.html
          git commit -m 'Remove exposed Gemini API key'
          git push
