name: Grammar Gemini patch

on:
  push:
    branches:
      - chore/gemini-cost-security-20260812
    paths:
      - .github/workflows/one-time-gemini-security-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/gemini-cost-security-20260812
      - name: Patch source
        run: python .github/grammar_patch.py
      - name: Clean temporary patch files
        run: |
          rm -f .github/grammar_patch.py
          rm -f .github/workflows/one-time-gemini-security-patch.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Secure Grammar Gemini key and reduce API cost"
          git push origin HEAD:chore/gemini-cost-security-20260812
