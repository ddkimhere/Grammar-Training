name: One-time Gemini security and cost patch

on:
  push:
    branches:
      - chore/gemini-cost-security-20260812
    paths:
      - .github/workflows/one-time-gemini-security-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/gemini-cost-security-20260812

      - name: Patch Grammar Training Gemini configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove the API key committed in the public HTML without reproducing its value.
          text, key_count = re.subn(
              r"const FIXED_GEMINI_API_KEY\s*=\s*['\"][^'\"]+['\"];",
              """const GEMINI_API_KEY_STORAGE = 'yms_grammar_gemini_api_key';

function getStoredGeminiApiKey() {
    return (localStorage.getItem(GEMINI_API_KEY_STORAGE) || '').trim();
}

function configureGeminiApiKey() {
    const current = getStoredGeminiApiKey();
    const entered = window.prompt(
        'Gemini API Key를 입력하세요. 이 키는 이 브라우저의 localStorage에만 저장됩니다.',
        current
    );
    if (entered === null) return current;
    const clean = entered.trim();
    if (!clean) {
        localStorage.removeItem(GEMINI_API_KEY_STORAGE);
        alert('저장된 Gemini API Key를 삭제했습니다.');
        return '';
    }
    localStorage.setItem(GEMINI_API_KEY_STORAGE, clean);
    alert('Gemini API Key를 이 브라우저에 저장했습니다.');
    return clean;
}""",
              text,
              count=1,
          )
          if key_count != 1:
              raise SystemExit(f'Expected one hardcoded API key declaration, found {key_count}')

          old_generate_key = "    const apiKey = FIXED_GEMINI_API_KEY;"
          new_generate_key = """    let apiKey = getStoredGeminiApiKey();
    if (!apiKey) apiKey = configureGeminiApiKey();
    if (!apiKey) {
        alert('Gemini API Key를 먼저 설정해주세요.');
        return;
    }"""
          if old_generate_key not in text:
              raise SystemExit('generateExam API-key assignment was not found')
          text = text.replace(old_generate_key, new_generate_key, 1)

          # Add a small key-management button to the input screen.
          status_block = """        <div class=\"rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800\">\n            Gemini API 연결 준비 완료\n        </div>"""
          status_replacement = status_block + """

        <button type=\"button\" onclick=\"configureGeminiApiKey()\" class=\"w-full border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2.5 rounded-lg text-sm\">Gemini API Key 설정 / 변경</button>"""
          if status_block not in text:
              raise SystemExit('Gemini connection status block was not found')
          text = text.replace(status_block, status_replacement, 1)

          old_model = 'gemini-2.5-flash'
          model_count = text.count(old_model)
          if model_count < 1:
              raise SystemExit('Gemini 2.5 Flash model reference was not found')
          text = text.replace(old_model, 'gemini-3.1-flash-lite')

          # Explicitly keep thinking at the model's minimum level for this high-volume generation task.
          old_schema_line = "                            responseSchema,\n                            maxOutputTokens: 65536,"
          new_schema_line = "                            responseSchema,\n                            thinkingConfig: { thinkingLevel: 'minimal' },\n                            maxOutputTokens: 65536,"
          if old_schema_line not in text:
              raise SystemExit('generationConfig responseSchema block was not found')
          text = text.replace(old_schema_line, new_schema_line, 1)

          # Structured output should not need five full regeneration attempts. Cap it at three to limit runaway spend.
          text = text.replace('전체 생성을 최대 5회 자동 재시도한다.', '전체 생성을 최대 3회 자동 재시도한다.', 1)
          text = text.replace('generationAttempt <= 5', 'generationAttempt <= 3', 1)
          text = text.replace('generationAttempt < 5', 'generationAttempt < 3', 1)
          text = text.replace('AI 응답 JSON을 5회 생성했지만', 'AI 응답 JSON을 3회 생성했지만', 1)

          path.write_text(text, encoding='utf-8')
          print(f'Updated {model_count} Gemini model reference(s)')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-gemini-security-patch.yml

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-gemini-security-patch.yml
          git commit -m "Secure Grammar Gemini key and reduce API cost"
          git push origin HEAD:chore/gemini-cost-security-20260812
