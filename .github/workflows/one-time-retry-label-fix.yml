name: Grammar retry label fix

on:
  push:
    branches:
      - chore/gemini-cost-security-20260812
    paths:
      - .github/workflows/one-time-retry-label-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/gemini-cost-security-20260812
      - name: Fix retry counter text
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('(${generationAttempt}/5)', '(${generationAttempt}/3)'); p.write_text(s, encoding='utf-8')"
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/one-time-retry-label-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Grammar retry counter label"
          git push origin HEAD:chore/gemini-cost-security-20260812
