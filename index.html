<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YMS Grammar Training</title>
<style>
html,body{margin:0;min-height:100%;background:#f1f5f9;font-family:Arial,'Noto Sans KR',sans-serif}
#loading{display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:14px}
</style>
</head>
<body>
<div id="loading">YMS Grammar Training 불러오는 중...</div>
<script>
// Gemini v26 authentication compatibility:
// convert the legacy ?key= request into the current x-goog-api-key header.
(function(){
  const nativeFetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    let requestInput = input;
    let requestInit = init ? { ...init } : {};

    try {
      const rawUrl = typeof input === 'string' ? input : input?.url;
      if (rawUrl && rawUrl.includes('generativelanguage.googleapis.com') && rawUrl.includes(':generateContent')) {
        const url = new URL(rawUrl, window.location.href);
        const apiKey = url.searchParams.get('key');

        if (apiKey) {
          url.searchParams.delete('key');
          const headers = new Headers(requestInit.headers || (input instanceof Request ? input.headers : undefined));
          headers.set('x-goog-api-key', apiKey);
          requestInit.headers = headers;
          requestInput = url.toString();
        }
      }
    } catch (error) {
      console.warn('Gemini 인증 헤더 변환 오류', error);
    }

    return nativeFetch(requestInput, requestInit);
  };
})();

(async function(){
  try {
    const response = await fetch('./app-v22.html?v=23', { cache: 'no-store' });
    if (!response.ok) throw new Error('기본 페이지를 불러오지 못했습니다.');
    let html = await response.text();
    const patchTag = '<scr' + 'ipt src="./patch-v23.js?v=25"></scr' + 'ipt>';
    html = html.replace(/<\/body>/i, patchTag + '</body>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.getElementById('loading').textContent = '페이지 로딩 오류: ' + error.message;
  }
})();
</script>
</body>
</html>
