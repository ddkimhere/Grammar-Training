<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YMS Grammar Training</title>
<style>
html,body{margin:0;min-height:100%;background:#f1f5f9;font-family:Arial,'Noto Sans KR',sans-serif}
#loading{display:flex;align-items:center;justify-content:center;height:100vh;color:#475569;font-size:14px}
</style>
</head>
<body>
<div id="loading">YMS Grammar Training 불러오는 중...</div>
<script>
// v31: Gemini requests are sent to the server-side Vercel endpoint.
// Hard type blueprint loads first, then layout/diversity/stability rules, followed by rigorous final AI review.
(function(){
  const nativeFetch = window.fetch.bind(window);
  const proxyUrl = 'https://yms-grammar-api.vercel.app/api/gemini';

  window.fetch = function(input, init){
    try {
      const rawUrl = typeof input === 'string' ? input : input?.url;
      const isGemini = rawUrl && rawUrl.includes('generativelanguage.googleapis.com') && rawUrl.includes(':generateContent');
      if (isGemini) {
        return nativeFetch(proxyUrl, init);
      }
    } catch (error) {
      console.warn('Vercel proxy routing error', error);
    }
    return nativeFetch(input, init);
  };
})();

(async function(){
  try {
    const response = await fetch('./app-v22.html?v=31', { cache: 'no-store' });
    if (!response.ok) throw new Error('기본 페이지를 불러오지 못했습니다.');
    let html = await response.text();
    // patch-v31 is intentionally loaded before v23/v28 so its exact blueprint
    // is the final generation instruction immediately before the proxy call.
    const patchTags = '<scr' + 'ipt src="./patch-v31.js?v=31"></scr' + 'ipt>' +
                      '<scr' + 'ipt src="./patch-v23.js?v=31"></scr' + 'ipt>' +
                      '<scr' + 'ipt src="./patch-v28.js?v=31"></scr' + 'ipt>' +
                      '<scr' + 'ipt src="./patch-v29.js?v=31"></scr' + 'ipt>';
    html = html.replace(/<\/body>/i, patchTags + '</body>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.getElementById('loading').textContent = '페이지 로딩 오류: ' + error.message;
  }
})();
</script>
</body>
</html>
